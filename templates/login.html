{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 mt-8">
  <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">เข้าสู่ระบบ 🔐</h1>
  <form id="loginForm" class="space-y-4">
    <div>
      <label class="text-sm text-slate-600">Username</label>
      <input name="username" required class="w-full mt-1 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>
    <div>
      <label class="text-sm text-slate-600">Password</label>
      <input name="password" type="password" required class="w-full mt-1 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>
    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-medium shadow">เข้าสู่ระบบ</button>
    <div id="err" class="text-sm text-red-600 hidden"></div>
  </form>

  <!-- แบ่งบรรทัด -->
  <div class="flex items-center my-4 gap-3">
    <div class="flex-1 h-px bg-slate-200"></div>
    <span class="text-xs text-slate-400">หรือ</span>
    <div class="flex-1 h-px bg-slate-200"></div>
  </div>

  <!-- Google Sign-in (Firebase) -->
  <button id="googleBtn" onclick="firebaseLogin()"
          class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 py-2.5 rounded-lg font-medium shadow-sm flex items-center justify-center gap-2 transition">
    <svg class="w-5 h-5" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
    </svg>
    <span>เข้าสู่ระบบด้วย Google</span>
  </button>

  <p class="text-center text-sm text-slate-500 mt-4">ยังไม่มีบัญชี? <a href="/register" class="text-indigo-600 hover:underline">สมัครสมาชิก</a></p>
  <div class="mt-6 text-xs text-slate-400 text-center border-t pt-4">
    Demo: <code>admin / admin1234</code> • <code>demo / demo1234</code>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/js/firebase-auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  console.log('[login] submit');
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
    });
    console.log('[login] status', res.status);
    const data = await res.json();
    console.log('[login] data', data);
    if (!res.ok) {
      const el = document.getElementById('err');
      el.textContent = data.detail || 'เข้าสู่ระบบไม่สำเร็จ';
      el.classList.remove('hidden');
      return;
    }
    localStorage.setItem('token', data.access_token);
    window.location = '/dashboard';
  } catch (err) {
    console.error('[login] error', err);
    const el = document.getElementById('err');
    el.textContent = 'Error: ' + err.message;
    el.classList.remove('hidden');
  }
});
</script>
{% endblock %}
